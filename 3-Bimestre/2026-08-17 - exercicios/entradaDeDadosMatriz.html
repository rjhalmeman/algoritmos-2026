<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Entrada em Matriz</title>
</head>

<body>
    <h2>Entrada de Dados em Matriz</h2>

    <!-- 1. DEFINIÇÃO DAS DIMENSÕES DA MATRIZ -->
    <h3>1. Configurar Matriz</h3>
    <label for="inputLinhas">Quantidade de Linhas: </label>
    <input type="number" id="inputLinhas" value="2" min="1"><br><br>

    <label for="inputColunas">Quantidade de Colunas: </label>
    <input type="number" id="inputColunas" value="3" min="1"><br><br>

    <input type="button" value="Criar / Reiniciar Matriz" onclick="criarMatriz()"><br><br>

    <hr>

    <!-- 2. ENTRADA DE DADOS -->
    <h3>2. Inserção de Dados</h3>
    <span id="spanLimite">Clique em "Criar / Reiniciar Matriz" para começar.</span><br><br>
    <span id="spanPosicaoAtual">Próxima inserção em: <b>Matriz[0][0]</b></span><br><br>

    <label for="inputNumero">Número inteiro: </label>
    <input type="number" id="inputNumero" disabled>
    <input type="button" id="btnAdicionar" value="Adicionar à Matriz" onclick="adicionar()" disabled><br><br>

    <label for="outputContador">Elementos Lidos: </label>
    <span id="outputContador">0</span><br><br>

    <label><b>Estrutura da Matriz:</b></label><br>
    <div id="dadosLidos">[ ]</div><br><br>

    <hr>

    <!-- 3. CÁLCULO DE SOMA -->
    <h3>3. Cálculo de Soma</h3>
    <input type="button" value="Calcular Soma" onclick="calcularSoma()"><br>
    <label for="resultadoSoma">Soma: </label>
    <span id="resultadoSoma">0</span><br><br>

    <script src="entradaDeDadosMatriz.js"></script>

   
</body>

</html>
