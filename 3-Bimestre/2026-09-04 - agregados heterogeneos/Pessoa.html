<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoa</title>
</head>

<body>
    <input type="button" value="Listar Pessoas" onclick="listarTodasAsPessoas()">
    <span id="todasAsPessoas"></span>
    <script src="Pessoa.js"></script>
    <script>
        let listaPessoas = [];
        let pessoa = new Pessoa(123, "Maria da Silva", "2010-10-25", 1.65);
        listaPessoas.push(pessoa);
        pessoa = new Pessoa(124, "José Carlos Pereira", " 2010-10-25", 1.68);
        listaPessoas.push(pessoa);
        pessoa = new Pessoa(122, "João Paulo Cardoso", " 2010-12-25", 1.86);
        listaPessoas.push(pessoa);

        function mostrarListaPessoas(listaPessoas) {
            let listagem = "<br>";
            for (let i = 0; i < listaPessoas.length; i++) {
                const linha = listaPessoas[i];
                listagem += linha.nome + " - " + linha.cpf
                    + " - " + linha.dataNascimento + "<br>"
            }
            return listagem;
        }
        function listarTodasAsPessoas() {
            let lp = mostrarListaPessoas(listaPessoas);
            document.getElementById("todasAsPessoas").innerHTML = lp;
        }
    </script>
</body>

</html>
