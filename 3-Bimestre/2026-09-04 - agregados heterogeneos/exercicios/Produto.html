<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
</head>

<body>
    <input type="button" value="ex03 - Listar Produtos" onclick="mostrarListaComTodosOsProdutos()"><br>
    <input type="button" value="ex04 - Produto Mais Pesado" onclick="mostrarProdutoMaisPesado()"><br>
    <input type="button" value="ex10 - Listar produtos com poucas unidades no estoque"
        onclick="mostrarEstoqueBaixo()"><br>
    <!-- 12 -->
    <input type="text" id="inputNomeProcurado" placeholder="Digite o nome a ser procurado">
    <input type="button" value="ex12 - Procurar por nome" onclick="mostrarProcuradoPeloNome()"><br>

    <input type="button" value="ex13 - Valor acumulado" onclick="mostrarValorAcumulado()"><br>

    <span id="resposta"></span>

    <script src="Produto.js"></script>

    <script>
        let listaProdutos = [];
        // Instanciando todos os produtos
        let produto = new Produto(1, "Bola de Futebol Campo", 89.90, 0.45, 30);
        listaProdutos.push(produto);

        produto = new Produto(2, "Chuteira Society", 199.90, 0.70, 15);
        listaProdutos.push(produto);

        produto = new Produto(3, "Raquete de Tênis", 350.00, 0.30, 8);
        listaProdutos.push(produto);

        produto = new Produto(4, "Bola de Basquete", 120.00, 0.62, 20);
        listaProdutos.push(produto);

        produto = new Produto(5, "Kettlebell 12kg", 180.00, 12.00, 5);
        listaProdutos.push(produto);

        produto = new Produto(6, "Caneleira de Futebol", 35.00, 0.15, 40);
        listaProdutos.push(produto);

        produto = new Produto(7, "Luva de Boxe 12oz", 150.00, 0.80, 12);
        listaProdutos.push(produto);

        produto = new Produto(8, "Prancha Stand Up Paddle", 2500.00, 11.50, 2);
        listaProdutos.push(produto);

        produto = new Produto(9, "Óculos de Natação", 45.00, 0.08, 50);
        listaProdutos.push(produto);

        produto = new Produto(10, "Colchonete de Yoga", 65.00, 0.90, 25);
        listaProdutos.push(produto);

        produto = new Produto(11, "Anilha de Ferro 10kg", 130.00, 10.00, 10);
        listaProdutos.push(produto);

        produto = new Produto(12, "Capacete de Ciclismo", 160.00, 0.28, 18);
        listaProdutos.push(produto);

        produto = new Produto(13, "Corda de Pular Veloz", 25.00, 0.12, 60);
        listaProdutos.push(produto);

        produto = new Produto(14, "Mochila de Hidratação", 210.00, 0.40, 14);
        listaProdutos.push(produto);

        produto = new Produto(15, "Kimono de Jiu-Jitsu", 380.00, 1.80, 7);
        listaProdutos.push(produto);


        //01
        function todosOsProdutos(listaProdutos) {
            let listagem = "<br>";
            listagem += "<strong>Nome | Preço Unitário </strong><br>";
            listagem += "------------------------------------------------<br>";
            for (let i = 0; i < listaProdutos.length; i++) {
                const linha = listaProdutos[i];
                listagem += linha.nome + " - R$ " + linha.precoUnitario.toFixed(2) +
                    "<br>";
            }
            return listagem;
        }

        function mostrarListaComTodosOsProdutos() {
            document.getElementById("resposta").innerHTML = todosOsProdutos(listaProdutos);
        }

        ///////////////////////////////////////////////////////////////////////////////////////////////////////
        //04
        function produtoMaisPesado(listaProdutos) {
            let maisPesado = listaProdutos[0].peso;
            let pos = 0;
            for (let i = 1; i < listaProdutos.length; i++) {
                let linha = listaProdutos[i];
                if (linha.peso > maisPesado) {
                    maisPesado = linha.peso;
                    pos = i;
                }
            }
            return "Produto mais pesado: " + listaProdutos[pos].nome + " - " + listaProdutos[pos].peso.toFixed(2) + " kg";
        }
        function mostrarProdutoMaisPesado() {
            document.getElementById("resposta").innerHTML = produtoMaisPesado(listaProdutos);
        }

        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        //10
        function estoqueBaixo(listaProdutos) {
            let listagem = "<br>";
            listagem += "<strong>Nome | Preço Unitário </strong><br>";
            listagem += "------------------------------------------------<br>";
            for (let i = 0; i < listaProdutos.length; i++) {
                const linha = listaProdutos[i];
                if (linha.quantidadeEstoque < 10) {

                    listagem += linha.nome + " - R$ " + linha.precoUnitario.toFixed(2) + " - " + linha.quantidadeEstoque + "<br>";
                }
            }
            return listagem;
        }
        function mostrarEstoqueBaixo() {
            document.getElementById("resposta").innerHTML = estoqueBaixo(listaProdutos);
        }
        ///////////////////////////////////////////////////////////////////////////////////////////////////////
        //12
        function procurarPorNome(listaProdutos, nomeProcurado) {
            let listagem = "<br>";
            listagem += "<strong>Nome | Preço Unitário </strong><br>";
            listagem += "------------------------------------------------<br>";
            for (let i = 0; i < listaProdutos.length; i++) {
                const linha = listaProdutos[i];
                if (linha.nome == nomeProcurado) {
                    listagem += linha.nome + " - R$ " + linha.precoUnitario.toFixed(2) + " - " + linha.quantidadeEstoque + "<br>";
                }
            }
            return listagem;
        }
        function mostrarProcuradoPeloNome() {
            const nomeProcurado = document.getElementById("inputNomeProcurado").value;
            document.getElementById("resposta").innerHTML = procurarPorNome(listaProdutos, nomeProcurado);
        }
        ////////////////////////////////////
        //13 - colaboração da Lais

        function valorestoque(listaProdutos) {
            let resp = ""
            for (let i = 0; i < listaProdutos.length; i++) {
                let linha = listaProdutos[i];
                resp += linha.nome + "- R$" + (linha.precoUnitario * linha.quantidadeEstoque).toFixed(2) + "<br>"
            }

            return resp
        }
        function mostrarValorAcumulado() {
            document.getElementById("resposta").innerHTML = valorestoque(listaProdutos);
        }

        ////


    </script>
</body>

</html>
