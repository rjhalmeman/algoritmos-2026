    <script>

        function Exibir() {
            let aux = "<table border='1'>";

            aux += "<tr>";
            aux += "<th>ID</th>";
            aux += "<th>Nome</th>";
            aux += "<th>Convênio</th>";
            aux += "<th>Idade</th>";
            aux += "<th>Peso</th>";
            aux += "<th>Altura</th>";

            for (let i = 0; i < listaPacientes.length; i++) {

        function NomeIdade() {
            let aux = "";

            for (let i = 0; i < listaPacientes.length; i++) {
                aux += "Nome: " + listaPacientes[i].nome + "<br>";
                aux += "Idade: " + listaPacientes[i].idade + "<br><br>";

        }

        function MaisVelho() {
            let velho = listaPacientes[0].idade;
            let aux = "";

            for (let i = 0; i < listaPacientes.length; i++) {
                if (listaPacientes[i].idade > velho) {
                    velho = listaPacientes[i].idade;
                    aux = "O paciente " + listaPacientes[i].nome + " é o mais velho, com " + velho + " anos.";
                }
            }

            document.getElementById("resp").innerHTML = aux;
        }

        function MaisNovo() {
            let novo = listaPacientes[0].idade;
            let aux = "";

            for (let i = 0; i < listaPacientes.length; i++) {
                if (listaPacientes[i].idade < novo) {
                    novo = listaPacientes[i].idade;
                    aux = "O paciente " + listaPacientes[i].nome + " é o mais novo, com " + novo + " anos.";
                }
            }

            document.getElementById("resp").innerHTML = aux;
        }

        function Pesado() {
            let pesado = listaPacientes[0].peso;
            let aux = "";

            for (let i = 0; i < listaPacientes.length; i++) {
                if (listaPacientes[i].peso > pesado) {
                    pesado = listaPacientes[i].peso;
                    aux = "O paciente " + listaPacientes[i].nome + " é o mais pesado, com " + pesado + " quilos.";
                }
            }

            document.getElementById("resp").innerHTML = aux;
        }

        function Leve() {
            let leve = listaPacientes[0].peso;
            let aux = "";

            for (let i = 0; i < listaPacientes.length; i++) {
                if (listaPacientes[i].peso < leve) {
                    leve = listaPacientes[i].peso;
                    aux = "O paciente " + listaPacientes[i].nome + " é o mais leve, com " + leve + " quilos.";
                }
            }

            document.getElementById("resp").innerHTML = aux;
        }

        function MediaIdades() {
            let aux = 0;
            let num = 0;

            for (let i = 0; i < listaPacientes.length; i++) {
                aux += listaPacientes[i].idade;
                num++;
            }

            let media = aux / num;
            document.getElementById("resp").innerHTML = media;
        }

        function MediaPesos() {
            let aux = 0;
            let num = 0;

            for (let i = 0; i < listaPacientes.length; i++) {
                aux += listaPacientes[i].peso;
                num++;
            }

            let media = aux / num;
            document.getElementById("resp").innerHTML = media.toFixed(2);
        }

        function acima50() {
            let aux = "";

            for (let i = 0; i < listaPacientes.length; i++) {
                if (listaPacientes[i].idade > 50) {
                    aux += listaPacientes[i].nome + " - " + listaPacientes[i].idade + "<br><br>";
                }
            }

            document.getElementById("resp").innerHTML = aux;
        }

        function filtroConvenio() {
            let convenio = document.getElementById("convenio").value;
            let aux = "";

            for (let i = 0; i < listaPacientes.length; i++) {
                if (listaPacientes[i].convenio.toLowerCase() == convenio.toLowerCase()) {
                    aux += "Nome: " + listaPacientes[i].nome + "<br>";
                    aux += "Convênio: " + listaPacientes[i].convenio + "<br><br>";
                }
            }

            document.getElementById("resp").innerHTML = aux;
        }

        function buscaNome() {
            let nome = document.getElementById("nomebusc").value;
            let aux = "";
            let pacienteEncontrado;

            for (let i = 0; i < listaPacientes.length; i++) {
                if (listaPacientes[i].nome.toLowerCase() == nome.toLowerCase()) {
                    pacienteEncontrado = listaPacientes[i];
                }
            }

            if (pacienteEncontrado != undefined) {
                aux += "Id: " + pacienteEncontrado.id + "<br>";
                aux += "Nome: " + pacienteEncontrado.nome + "<br>";
                aux += "Convênio: " + pacienteEncontrado.convenio + "<br>";
                aux += "Idade: " + pacienteEncontrado.idade + "<br>";
                aux += "Peso: " + pacienteEncontrado.peso + "<br>";
                aux += "Altura: " + pacienteEncontrado.altura;
            } else {
                alert("ERRO, esse nome não está na tabela");
            }

            document.getElementById("resp").innerHTML = aux;
        }

        function IMC(peso, altura) {
            return peso / altura ** 2;
        }

        function classificarPorIMC(imc) {
            let resp = "";
            if (imc < 18.5) {
                resp = "Abaixo do peso";
            } else if (imc >= 18.5 && imc <= 24.9) {
                resp = "Peso normal";
            } else if (imc >= 25 && imc <= 29.9) {
                resp = "Sobrepeso";
            } else if (imc >= 30 && imc <= 34.9) {
                resp = "Obesidade grau 1";
            } else if (imc >= 35 && imc <= 39.9) {
                resp = "Obesidade grau 2";
            } else if (imc >= 40) {
                resp = "Obesidade grau 3";
            }

            return resp;
        }

        function IMCclass() {
            let aux = "";
            for (let i = 0; i < listaPacientes.length; i++) {
                let imc = IMC(listaPacientes[i].peso, listaPacientes[i].altura);
                let clsIMC = classificarPorIMC(imc);
                aux += "Nome: " + listaPacientes[i].nome + "-" + " IMC: " + imc.toFixed(2) + " - " + clsIMC + "<br>";
            }
            document.getElementById("resp").innerHTML = aux;
        }

        function Sobrepeso() {
            let aux = "Pacientes com sobrepeso <br><br>";

            for (let i = 0; i < listaPacientes.length; i++) {
                let imc = IMC(listaPacientes[i].peso, listaPacientes[i].altura);
                if (imc >= 25 && imc <= 29.9) {
                    aux += "Nome: " + listaPacientes[i].nome + "-" + " IMC: " + imc.toFixed(2) + "<br>";
                }
            }
            document.getElementById("resp").innerHTML = aux;
        }

        ////////////////////////////////////////////////////////////////////////////////////////////////////////////
        //função auxiliar
        function bubbleSortConvenio(lista) {
            // cópia  da lista - reservar o espaço e preservar a lista original
            let novaLista = [];
            for (let i = 0; i < lista.length; i++) {
                novaLista[i] = lista[i];
            }
            let n = novaLista.length;

            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    if (novaLista[j].convenio > novaLista[j + 1].convenio) {
                        let temp = novaLista[j];
                        novaLista[j] = novaLista[j + 1];
                        novaLista[j + 1] = temp;
                    }
                }
            }
            return novaLista;
        }

          ////////////////////////////////////////////////////////////////////////////////////////////////////////////
        //função auxiliar
        function bubbleSortIdade(lista) {
            // cópia  da lista - reservar o espaço e preservar a lista original
            let novaLista = [];
            for (let i = 0; i < lista.length; i++) {
                novaLista[i] = lista[i];
            }
            let n = novaLista.length;

            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    if (novaLista[j].idade > novaLista[j + 1].idade) {
                        let temp = novaLista[j];
                        novaLista[j] = novaLista[j + 1];
                        novaLista[j + 1] = temp;
                    }
                }
            }
            return novaLista;
        }

        ////////////////////////////////////////////////////////////////////////////////////////////////////////////
        //função auxiliar

        function conveniosNaLista(lista) {
            let listaOrdenada = bubbleSortConvenio(lista);
            let vetorConvenios = [];

            if (listaOrdenada.length === 0) {
                return vetorConvenios;
            }

            for (let i = 0; i < listaOrdenada.length; i++) {
                // Se for o primeiro elemento OU for diferente do anterior, adiciona
                if (i === 0 || listaOrdenada[i].convenio !== listaOrdenada[i - 1].convenio) {
                    vetorConvenios.push(listaOrdenada[i].convenio);
                }
            }

            return vetorConvenios;
        }

        function mostrarConvenios() {
            let conv = conveniosNaLista(listaPacientes);
            document.getElementById("resp").innerHTML = conv;
        }



        function contagemDePacientesPorConvenio() {
            let vetorComConveniosNaLista = conveniosNaLista(listaPacientes);
            let aux = vetorComConveniosNaLista + "<br><br>";
            for (let i = 0; i < vetorComConveniosNaLista.length; i++) {
                //para cada um dos convenios
                let cont = 0;
                for (let k = 0; k < listaPacientes.length; k++) {
                    if (listaPacientes[k].convenio == vetorComConveniosNaLista[i]) {
                        cont++;
                    }
                }
                aux += vetorComConveniosNaLista[i] + " possui " + cont + " pacientes <br>";
            }
            document.getElementById("resp").innerHTML = aux;
        }

         function contarPorFaixa(lista) {            
            let contPorFaixa = [0, 0, 0];
            //para cada um dos convenios
            for (let k = 0; k < lista.length; k++) {
                if (lista[k].idade < 30) {
                    contPorFaixa[0]++;
                } else if (lista[k].idade < 60) {
                    contPorFaixa[1]++;
                } else {
                    contPorFaixa[2]++;
                }
            }
           return contPorFaixa;
        }

        function contagemDePacientesPorFaixaEtaria() {
            let vetorComFaixasEtarias = ["Jovem", "Adulto", "Idoso"]
            let contPorFaixa = contarPorFaixa(listaPacientes)          

            let aux = vetorComFaixasEtarias + "<br><br>";
            for (let i = 0; i < vetorComFaixasEtarias.length; i++) {
                aux += vetorComFaixasEtarias[i] + " possui " + contPorFaixa[i] + " pacientes <br>";
            }
            document.getElementById("resp").innerHTML = aux;
        }


        function ordenadoPorIdade() {
            let aux = "Ordenado por idade <br><br>";
            const lista = bubbleSortIdade(listaPacientes);

                aux += lista[i].nome + " - " + lista[i].idade + "<br>";
            }

            document.getElementById("resp").innerHTML = aux;
        }
