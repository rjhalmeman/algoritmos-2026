<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz 3x3</title>
</head>
<body>
    <h1>Matriz 3x3 - versão Geovana</h1>
    <table>
        <script>
            //vai criar a matriz 3x3 com inputs para o usuário preencher
            for (let i = 0; i < 3; i++) {
                document.write("<tr>");
                for (let j = 0; j < 3; j++) {
                    document.write("<td><input type='number' id='m" + i + j + "' style='width:50px'></td>");
                }
                document.write("</tr>");
            }
        </script>
    </table>
    <br>
    <button onclick="mostrar()">Mostrar Matriz</button>
    <br>
    <p id="resposta"></p>

    <script>
        function mostrar(){
            let matriz = [];
            for(let i = 0; i < 3; i++){
                matriz[i] = [];
                for(let j = 0; j < 3; j++){
                    matriz[i][j] = parseInt(document.getElementById("m" + i + j).value);
                }
            }
            document.getElementById("resposta").innerHTML = processarMatriz(matriz);
        }

        function processarMatriz(matriz){
            let resp = "";
            for(let i = 0; i < 3; i++){
                for(let j = 0; j < 3; j++){
                    if(matriz[i][j] < 0){
                        matriz[i][j] = 0;
                    }
                    resp += matriz[i][j] + " ";
                }
                resp += "<br>";
            }
            return resp;
        }
    </script>
</body>
</html>
