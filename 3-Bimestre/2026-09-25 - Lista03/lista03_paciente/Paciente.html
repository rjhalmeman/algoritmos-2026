    <input type="button" value="exY - Lista de convênios" onclick="mostrarConvenios()"><br>

    <span id="resposta"></span>

    <script src="Paciente.js"></script>

    <script>

        paciente = new Paciente(12, "Lucas Reis", "Amil", 42, 75.0, 1.72);

        paciente = new Paciente(13, "Marina Paiva", "Unimed", 29, 60.0, 1.68);
        listaPacientes.push(paciente);

        paciente = new Paciente(14, "Nelson Braga", "SUS", 67, 85.0, 1.74);

    <script>

        //exercício 03
        function listarPacientes(lista) {
            let listagem = "";
            listagem += "<strong>Nome | Convênio | Idade</strong><br>";
            listagem += "----------------------------------------<br>";
            for (let i = 0; i < lista.length; i++) {
                const linha = lista[i];
                listagem += i + " - " + linha.nome + " - " + linha.convenio + " - " + linha.idade + " anos<br>";
            }
            return listagem;
        }

        function mostrarTodosOsPacientes() {
            document.getElementById("resposta").innerHTML = listarPacientes(listaPacientes);
        }

        ////////////////////////////////////////////////////////////////////////////////////////////////////////////
        //exercício 04

        function pacienteMaisPesado(lista) {
            let maisPesado = lista[0].peso;
            let pos = 0;
            for (let i = 1; i < lista.length; i++) {
                if (lista[i].peso > maisPesado) {
                    maisPesado = lista[i].peso;
                    pos = i;
                }
            }
            return pos;
        }

        function mostrarPacienteMaisPesado() {
            const pos = pacienteMaisPesado(listaPacientes);
            const p = listaPacientes[pos];
            document.getElementById("resposta").innerHTML =
                "Paciente mais pesado: <strong>" + p.nome +
                "</strong> — " + p.peso + " kg (convênio: " + p.convenio + ")";
        }

        ////////////////////////////////////////////////////////////////////////////////////////////////////////////
        //função auxiliar

        function conveniosNaLista(lista) {
            let listaOrdenada = bubbleSortConvenio(lista);
            let vetorConvenios = [];

            if (listaOrdenada.length === 0) {
                return vetorConvenios;
            }

            for (let i = 0; i < listaOrdenada.length; i++) {
                // Se for o primeiro elemento OU for diferente do anterior, adiciona
                if (i === 0 || listaOrdenada[i].convenio !== listaOrdenada[i - 1].convenio) {
                    vetorConvenios.push(listaOrdenada[i].convenio);
                }
            }

            return vetorConvenios;
        }

        function mostrarConvenios() {
            let conv = conveniosNaLista(listaPacientes);
            document.getElementById("resposta").innerHTML = conv;
        }


        ////////////////////////////////////////////////////////////////////////////////////////////////////////////
        //função auxiliar    
        function contarPorConvenio(lista) {
            let vetorConvenios = conveniosNaLista(lista)
            let resp = [];
            for (let i = 0; i < vetorConvenios.length; i++) {
                let cont = 0;
                for (let k = 0; k < lista.length; k++) {
                    if (vetorConvenios[i] == lista[k].convenio) {
                        cont++;
                    }
                }
                resp.push(vetorConvenios[i] + " - " + cont);

            }
            return resp;
        }


        function mostrarContagemPorConvenio() {
            let r = contarPorConvenio(listaPacientes);
            document.getElementById("resposta").innerHTML = r;
        }

        ////////////////////////////////////////////////////////////////////////////////////////////////////////////
        //função auxiliar
        function bubbleSortConvenio(lista) {
            // cópia  da lista - reservar o espaço e preservar a lista original
            let novaLista = [];
            for (let i = 0; i < lista.length; i++) {
                novaLista[i] = lista[i];
            }
            let n = novaLista.length;

            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    if (novaLista[j].convenio > novaLista[j + 1].convenio) {
                        let temp = novaLista[j];
                        novaLista[j] = novaLista[j + 1];
                        novaLista[j + 1] = temp;
                    }
                }
            }
            return novaLista;
        }


        // mostrar lista ordenada
        function mostrarListaOrdenada() {
            let listaOrdenadaPorConvenio = bubbleSortConvenio(listaPacientes);
            document.getElementById("resposta").innerHTML = listarPacientes(listaOrdenadaPorConvenio);
        }

    </script>

</body>
