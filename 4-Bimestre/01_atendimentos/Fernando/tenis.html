<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Tênis</title>
</head>

<body>

    <h1 style="background-color: rgb(116, 113, 113);">Cadastro de Tênis</h1>

    <label for="inputidTenis">ID do Tênis</label>
    <input type="text" name="inputidTenis" id="inputidTenis">
    <input type="button" value="Procure" id="btProcure" onclick="procure()" style="display:inline;">
    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
    
    <br><br>

    <label for="inputMarca">Marca</label>
    <input type="text" name="inputMarca" id="inputMarca">
    <br>

    <label for="inputModelo">Modelo</label>
    <input type="text" name="inputModelo" id="inputModelo">
    <br>

    <label for="inputPreco">Preço de revenda (em R$)</label>
    <input type="number" name="inputPreco" id="inputPreco">
    <br>

    <label for="inputTamanho">Tamanho do calçado</label>
    <input type="number" name="inputTamanho" id="inputTamanho">
    <br><br>
    
    <!-- Novo input e botão de filtro ANTES da linha de avisos -->
    <label for="inputFiltroMarca">Filtrar por Marca:</label>
    <input type="text" id="inputFiltroMarca" placeholder="Ex: Nike">
    <input type="button" value="Filtrar por qual marca?" id="btNike" onclick="checkMarca()" style="display:inline;">
    
    <br><br>
    
    <!-- Linha de avisos -->
    <div id="divAviso" style="background-color: antiquewhite;"></div>
    <br>
    
    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
    
    <br><br>

    <div id="outputSaida" style="background-color: aqua;">...</div>

    <script src="./tenis.js"></script>
    <script src="./tenisControle.js"></script>
</body>

</html>
