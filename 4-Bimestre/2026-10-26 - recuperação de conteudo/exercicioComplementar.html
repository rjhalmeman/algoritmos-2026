<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pelúcias</title>
</head>

<body>
    <input type="button" value="Listar Pelúcias" onclick="mostrarTodosOsProdutos()"><br>
    <input type="button" value="Ordenar" onclick="mostrarOrdenado()"><br>
    <input type="button" value="Média de pesos" onclick="mostrarMediaDePesos()"><br>
    <input type="button" value="Média de Peso por Categoria" onclick="mostrarMediaPesoPorCategoria()"><br>
    <br>
    <span id="resposta"></span>
    <script src="produto.js"></script>
    <script>
        // CADASTRO DE PELÚCIAS       
        let listaProdutos = [];
        let p = new Produto(1, "Teddy", 1.50, "Marrom", "Ursos", "2023-05-12", 105.90);
        listaProdutos.push(p);
        p = new Produto(2, "Uni", 0.40, "Rosa", "Mágicos", "2022-11-01", 79.90);
        listaProdutos.push(p);
        p = new Produto(3, "Arlo", 0.60, "Verde", "Dinossauros", "2023-08-20", 89.90);
        listaProdutos.push(p);
        p = new Produto(4, "Buck", 0.30, "Verde", "Dinossauros", "2024-02-10", 59.90);
        listaProdutos.push(p);
        p = new Produto(5, "Mila", 1.2, "Marrom", "Ursos", "2021-09-15", 135.00);
        listaProdutos.push(p);

        function listarProdutosTabela(lista) {
            let listagem = "";
            listagem += "<table>";
            listagem += "<thead>";
            listagem += "<tr>";
            listagem += "<th>ID</th>";
            listagem += "<th>Nome</th>";
            listagem += "<th>Peso (kg)</th>";
            listagem += "<th>Cor</th>";
            listagem += "<th>Categoria</th>";
            listagem += "<th>Data de Lançamento</th>";
            listagem += "<th>Preço (R$)</th>";
            listagem += "</tr>";
            listagem += "</thead>";
            listagem += "<tbody>";

            for (let i = 0; i < lista.length; i++) {
                const p = lista[i];
                listagem += "<tr>";
                listagem += "<td class='num'>" + p.id + "</td>";
                listagem += "<td>" + p.nome + "</td>";
                listagem += "<td class='num'>" + p.peso + "</td>";
                listagem += "<td>" + p.cor + "</td>";
                listagem += "<td>" + p.categoria + "</td>";
                listagem += "<td>" + p.dataLancamento + "</td>";
                listagem += "<td class='num'>" + p.preco.toFixed(2) + "</td>";
                listagem += "</tr>";
            }

            listagem += "</tbody>";
            listagem += "</table>";
            return listagem;
        }

        function listarProdutos(lista) {
            let listagem = "";
            for (let i = 0; i < lista.length; i++) {
                listagem += "ID: " + lista[i].id + " - ";
                listagem += "Nome: " + lista[i].nome + " - ";
                listagem += "Peso: " + lista[i].peso + "kg - ";
                listagem += "Cor: " + lista[i].cor + " - ";
                listagem += "Categoria: " + lista[i].categoria + " - ";
                listagem += "Data de Lançamento: " + lista[i].dataLancamento + " - ";
                listagem += "Preço: R$ " + lista[i].preco.toFixed(2);
                listagem += "<br>";
            }
            return listagem;
        }

        function mostrarTodosOsProdutos() {
            document.getElementById("resposta").innerHTML = listarProdutosTabela(listaProdutos);
        }

        function mostrarMediaDePesos() {
            let soma = 0;
            for (let i = 0; i < listaProdutos.length; i++) {
                soma = soma + listaProdutos[i].peso;
            }
            document.getElementById("resposta").innerHTML = "média = " + (soma / listaProdutos.length).toFixed(2) + " kg";
        }

        function mostrarMediaPesoPorCategoria() {
            let vetorCategorias = [];
            let verificador = 0;

            // Encontrar categorias únicas
            for (let i = 0; i < listaProdutos.length; i++) {
                for (let j = 0; j < vetorCategorias.length; j++) {
                    if (listaProdutos[i].categoria == vetorCategorias[j]) {
                        verificador++;
                    }
                }
                if (verificador == 0) {
                    vetorCategorias.push(listaProdutos[i].categoria);
                }
                verificador = 0;
            }

            let listagem = "<strong>Média de Peso por Categoria:</strong><br><br>";
            let contador = 0;
            let somaPeso = 0;

            // Calcular a média
            for (let k = 0; k < vetorCategorias.length; k++) {
                listagem += vetorCategorias[k] + ": ";
                for (let l = 0; l < listaProdutos.length; l++) {
                    if (listaProdutos[l].categoria == vetorCategorias[k]) {
                        somaPeso += listaProdutos[l].peso;
                        contador++;
                    }
                }
                
                let media = somaPeso / contador;
                listagem += media.toFixed(2) + " kg<br>";
                contador = 0;
                somaPeso = 0;
            }
            
            document.getElementById("resposta").innerHTML = listagem;
        }

        function funcaoBubbleSort(conj) {
            for (let topo = conj.length - 1; topo > 0; topo--) {
                for (let i = 0; i < topo; i++) {
                    if (conj[i].nome > conj[i + 1].nome) {
                        let bolha = conj[i];
                        conj[i] = conj[i + 1];
                        conj[i + 1] = bolha;
                    }
                }
            }
            return conj;
        }

        function mostrarOrdenado() {
            let resultado = funcaoBubbleSort(listaProdutos);
            document.getElementById("resposta").innerHTML = listarProdutos(resultado);
        }

    </script>
</body>

</html>
